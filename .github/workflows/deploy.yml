name: deploy

# Après un build réussi sur main : publie les images sur ghcr.io puis met à jour le VPS.
# Le déploiement sur le VPS ne s'exécute que si la variable de dépôt VPS_HOST est définie.
#
# Variables de dépôt (Settings → Secrets and variables → Actions → Variables) :
#   VPS_HOST   IP ou nom du VPS
#   VPS_USER   utilisateur SSH (deploy)
# Secrets :
#   VPS_SSH_KEY         clé privée SSH de déploiement
#   VPS_KNOWN_HOSTS     sortie de « ssh-keyscan <IP du VPS> »

on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  images:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        composant: [web, agent]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.composant }}
          push: true
          tags: |
            ghcr.io/ippous/infra-hub-${{ matrix.composant }}:latest
            ghcr.io/ippous/infra-hub-${{ matrix.composant }}:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.composant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.composant }}

  vps:
    needs: images
    if: vars.VPS_HOST != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Clé SSH
        run: |
          install -d -m 700 ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Copie de la configuration
        run: |
          scp -i ~/.ssh/id_deploy docker-compose.yml ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/opt/infrahub/
          scp -i ~/.ssh/id_deploy deploy/Caddyfile ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/opt/infrahub/deploy/

      - name: Mise à jour des conteneurs
        run: |
          ssh -i ~/.ssh/id_deploy ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} "
            set -e
            cd /opt/infrahub
            test -f .env || { echo '.env manquant dans /opt/infrahub'; exit 1; }
            export INFRAHUB_TAG=$TAG
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            docker compose pull --quiet web agent
            docker logout ghcr.io
            docker compose up -d --remove-orphans --no-build
            docker image prune -f
          "

      - name: Vérification
        run: |
          for i in $(seq 1 20); do
            if ssh -i ~/.ssh/id_deploy ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} \
              "docker compose -f /opt/infrahub/docker-compose.yml exec -T caddy wget -qO- http://web:8080/health" | grep -q Healthy; then
              echo "Infra Hub répond."; exit 0
            fi
            sleep 6
          done
          echo "Le service web ne répond pas." >&2
          ssh -i ~/.ssh/id_deploy ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} "cd /opt/infrahub && docker compose logs --tail 80 web"
          exit 1
