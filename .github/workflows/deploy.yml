name: deploy

# Après un build réussi sur main : publie les images web et agent sur ghcr.io.
# Le VPS les récupère lui-même toutes les 5 minutes (deploy/infrahub-maj.sh) :
# GitHub n'a besoin d'aucun accès au serveur.

on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  images:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        composant: [web, agent]
    env:
      REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REVISION }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.composant }}
          push: true
          tags: |
            ghcr.io/ippous/infra-hub-${{ matrix.composant }}:latest
            ghcr.io/ippous/infra-hub-${{ matrix.composant }}:${{ env.REVISION }}
          # Le VPS lit cette étiquette pour télécharger la configuration du même commit.
          labels: |
            org.opencontainers.image.revision=${{ env.REVISION }}
            org.opencontainers.image.source=https://github.com/ippous/infra-hub
          cache-from: type=gha,scope=${{ matrix.composant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.composant }}
